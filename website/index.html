<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Trigen — The world's first conversational AI agent for 3D creation. Turn text, photos or sketches into printable 3D models (FBX/OBJ/GLB/STL), run natively in the browser, and plug into Blender, Unity, Unreal Engine." />
    <title>Trigen · Three Begets Form, Mind Generates All</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // 重新部署后自愈：旧缓存的 index.html 引用的 JS 哈希已失效会 404，
      // 捕获脚本加载失败后自动刷新一次拉取最新 index.html（sessionStorage 防死循环）
      (function () {
        window.addEventListener(
          "error",
          function (e) {
            var el = e.target;
            if (
              el &&
              el.tagName === "SCRIPT" &&
              el.src &&
              !sessionStorage.getItem("trigen-reloaded")
            ) {
              sessionStorage.setItem("trigen-reloaded", "1");
              location.reload();
            }
          },
          true
        );
      })();
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
