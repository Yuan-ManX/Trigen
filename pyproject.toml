[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trigen"
version = "1.0.0"
description = "Trigen - AI-Native 3D Creation Agent Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Trigen" }]
dependencies = [
    # Agent 层依赖 / Agent layer dependencies
    "openai>=1.12.0",
    "trimesh>=4.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "lxml>=4.9.0",
    "shapely>=2.0.0",
    # API 层依赖 / API layer dependencies
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic-settings>=2.1.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
trigen-api = "trigen.api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trigen*"]

[tool.setuptools.package-data]
trigen = ["*.json", "*.yaml"]
